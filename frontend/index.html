<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-tooth"></i>
                <h1>OdontoCare</h1>
                <p>Sistema de Gestão Odontológica</p>
            </div>
            <div id="loginError" class="alert alert-error hidden"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••">
            </div>
            <button class="btn btn-primary btn-full" onclick="realizarLogin()">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <div class="login-footer">
                <p>Não tem conta? <a href="#" onclick="mostrarRegistro()">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <!-- TELA DE REGISTRO -->
    <div id="registerPage" class="login-page hidden">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-tooth"></i>
                <h1>OdontoCare</h1>
                <p>Criar nova conta</p>
            </div>
            <div id="registerError" class="alert alert-error hidden"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="registerSenha" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Perfil</label>
                <select id="registerRole">
                    <option value="usuario">Usuário</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <button class="btn btn-primary btn-full" onclick="realizarRegistro()">
                <i class="fas fa-user-plus"></i> Cadastrar
            </button>
            <div class="login-footer">
                <p>Já tem conta? <a href="#" onclick="mostrarLogin()">Entrar</a></p>
            </div>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="mainApp" class="hidden">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-tooth"></i>
                <span>OdontoCare</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" onclick="navegarPara('dashboard')">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" onclick="navegarPara('pacientes')">
                    <i class="fas fa-users"></i>
                    <span>Pacientes</span>
                </a>
                <a href="#" class="nav-item" onclick="navegarPara('consultas')">
                    <i class="fas fa-calendar-check"></i>
                    <span>Consultas</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <span id="userEmail" class="user-email"></span>
                        <span id="userRole" class="user-role"></span>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <div id="pageContent"></div>
        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/pacientes.js"></script>
    <script src="js/consultas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
